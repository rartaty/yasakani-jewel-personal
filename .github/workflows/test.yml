name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        # 指示書 §3.8 (CI/CD パイプライン完全性 / SLSA) の自己適用:
        # サードパーティ Action はタグ/ブランチではなくコミット SHA に固定する
        # (タグは改ざん可能。SHA は不変)。公式 v6 のコミットを確認して固定。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        # 同上、コミット SHA に固定
        uses: actions/setup-node@2951748f4c016b747952f8ca7e75fc64f2f62b53 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Syntax check (全 JS ファイル)
        run: |
          node --check bin/yasakani.js
          node --check src/init.js
          node --check src/scan.js
          node --check src/uninstall.js
          node --check src/jsonc.js
          node --check src/git-hooks.js

      - name: Unit tests
        run: npm test

      - name: Detection quality gate
        run: npm run eval

  secrets:
    name: Gitleaks secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
